events {
    worker_connections 4096;
}

http {
    upstream fan_portal_service {
        server app:8000;
        keepalive 64;
    }

    upstream journalist_studio_service {
        server journalist-studio:8001;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Deshabilitar buffering para Server-Sent Events (SSE) en tiempo real (HU-02)
        location /api/stream/ {
            proxy_pass http://fan_portal_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding off;
        }

        # Enrutar la Cabina del Periodista y la ingesta de eventos al microservicio dedicado (CQRS Write)
        location /periodista {
            proxy_pass http://journalist_studio_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /cabina {
            proxy_pass http://journalist_studio_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/events {
            proxy_pass http://journalist_studio_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ai/ {
            proxy_pass http://journalist_studio_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/media/ {
            client_max_body_size 200M;
            proxy_pass http://journalist_studio_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/match/ {
            proxy_pass http://journalist_studio_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auth/ {
            proxy_pass http://journalist_studio_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /media/ {
            proxy_pass http://journalist_studio_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/simulate-peak {
            proxy_pass http://journalist_studio_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Portal Público de Lectura Masiva para los 1,000+ Aficionados (CQRS Read)
        location / {
            proxy_pass http://fan_portal_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
