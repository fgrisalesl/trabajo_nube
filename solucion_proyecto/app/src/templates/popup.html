<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNAL SPORTS · Mini Marcador</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@500;600;700&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-obsidian: #0B0D0E;
      --bg-concrete: #121517;
      --bg-elevated: #181C1F;
      --ink-chalk: #F4F2EC;
      --ink-secondary: #A6ACA8;
      --ink-dark: #0B0D0E;
      --volt: #C8FF2E;
      --vermilion: #FF3B1D;
      --draw-slate: #3A4147;
      --hairline: rgba(244, 242, 236, 0.16);
      --hairline-strong: rgba(244, 242, 236, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-obsidian);
      color: var(--ink-chalk);
      font-family: 'DM Sans', -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      padding: 8px;
      -webkit-font-smoothing: antialiased;
    }

    .popup-desk {
      height: 100%;
      background: var(--bg-concrete);
      border: 1px solid var(--hairline-strong);
      border-top: 3px solid var(--volt);
      border-radius: 2px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .popup-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--hairline);
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-logo {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .brand-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--ink-chalk);
    }

    .live-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--ink-dark);
      background: var(--volt);
      padding: 1px 5px;
      border-radius: 2px;
    }

    .minute-tag {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--volt);
      background: var(--bg-obsidian);
      border: 1px solid var(--hairline);
      padding: 2px 7px;
      border-radius: 2px;
    }

    .scoreboard-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .team-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 0;
    }

    .team-badge-box {
      width: 34px;
      height: 34px;
      border-radius: 2px;
      background: var(--bg-obsidian);
      border: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      margin-bottom: 4px;
    }

    .team-col--home .team-badge-box { border-bottom: 2px solid var(--volt); }
    .team-col--away .team-badge-box { border-bottom: 2px solid var(--vermilion); }

    .team-badge {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .team-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ink-chalk);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .score-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg-obsidian);
      border: 1px solid var(--hairline-strong);
      border-radius: 2px;
      padding: 5px 12px;
    }

    .score-digit {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 32px;
      font-variant-numeric: tabular-nums;
      color: var(--ink-chalk);
      line-height: 0.9;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease;
    }

    .score-colon {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: var(--ink-secondary);
      line-height: 1;
    }

    .score-pop {
      transform: scale(1.22);
      color: var(--volt);
    }

    .pop-prob-box {
      padding: 0 2px;
    }

    .pop-prob-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      margin-bottom: 3px;
      font-variant-numeric: tabular-nums;
    }

    .prob-l-home { color: var(--volt); }
    .prob-l-draw { color: var(--ink-secondary); }
    .prob-l-away { color: var(--vermilion); }

    .pop-prob-track {
      width: 100%;
      height: 6px;
      background: var(--bg-obsidian);
      border: 1px solid var(--hairline);
      border-radius: 1px;
      overflow: hidden;
      display: flex;
      gap: 1px;
    }

    .pop-bar-seg {
      height: 100%;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pop-seg-h { background: var(--volt); }
    .pop-seg-d { background: var(--draw-slate); }
    .pop-seg-a { background: var(--vermilion); }

    .popup-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--hairline);
    }

    .latest-action {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--ink-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .btn-focus {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--ink-dark);
      background: var(--ink-chalk);
      border: none;
      border-radius: 2px;
      padding: 4px 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.16s ease, transform 0.12s ease;
    }

    .btn-focus:hover {
      background: var(--volt);
    }

    .btn-focus:active {
      transform: scale(0.96);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="popup-desk">
    <div class="popup-top">
      <div class="brand-box">
        <img src="/api/icon/logo" alt="" class="brand-logo" onerror="this.style.display='none'" />
        <span class="brand-title">UNAL SPORTS</span>
        <span class="live-tag">EN VIVO</span>
      </div>
      <div class="minute-tag">
        <span id="pop-minute">0</span>'
      </div>
    </div>

    <div class="scoreboard-row">
      <div class="team-col team-col--home">
        <div class="team-badge-box">
          <img id="pop-home-badge" src="/api/badge?team=Equipo%20Local" alt="" class="team-badge" onerror="this.onerror=null;this.src='/escudos/default.svg'" />
        </div>
        <span id="pop-home-team" class="team-name">Equipo Local</span>
      </div>

      <div class="score-center">
        <span id="pop-home-score" class="score-digit">0</span>
        <span class="score-colon">:</span>
        <span id="pop-away-score" class="score-digit">0</span>
      </div>

      <div class="team-col team-col--away">
        <div class="team-badge-box">
          <img id="pop-away-badge" src="/api/badge?team=Equipo%20Visitante" alt="" class="team-badge" onerror="this.onerror=null;this.src='/escudos/default.svg'" />
        </div>
        <span id="pop-away-team" class="team-name">Equipo Visitante</span>
      </div>
    </div>

    <div class="pop-prob-box">
      <div class="pop-prob-labels">
        <span class="prob-l-home"><span id="pop-prob-h-val">35%</span> <span id="pop-prob-h-name">Local</span></span>
        <span class="prob-l-draw">Empate <span id="pop-prob-d-val">30%</span></span>
        <span class="prob-l-away"><span id="pop-prob-a-name">Visita</span> <span id="pop-prob-a-val">35%</span></span>
      </div>
      <div class="pop-prob-track">
        <div id="pop-bar-h" class="pop-bar-seg pop-seg-h" style="width: 35%;"></div>
        <div id="pop-bar-d" class="pop-bar-seg pop-seg-d" style="width: 30%;"></div>
        <div id="pop-bar-a" class="pop-bar-seg pop-seg-a" style="width: 35%;"></div>
      </div>
    </div>

    <div class="popup-footer">
      <div id="pop-status-text" class="latest-action">Conectado · Esperando inicio del encuentro</div>
      <button type="button" class="btn-focus" onclick="focusMainApp()" title="Volver a la pestaña principal">
        Expandir ↗
      </button>
    </div>
  </div>

  <script>
    'use strict';
    var currentHome = '';
    var currentAway = '';
    var knownEvents = new Map();

    function animateScore(id, val) {
      var el = document.getElementById(id);
      if (el && el.textContent !== String(val)) {
        el.textContent = val;
        el.classList.add('score-pop');
        setTimeout(function () { el.classList.remove('score-pop'); }, 550);
      }
    }

    function calcWinProbability(hScore, aScore, minute, status, redH, redA) {
      if (/FINAL/i.test(status || '')) {
        if (hScore > aScore) return { home: 100, draw: 0, away: 0 };
        if (aScore > hScore) return { home: 0, draw: 0, away: 100 };
        return { home: 0, draw: 100, away: 0 };
      }
      var m = Math.max(0, Math.min(90, Number(minute) || 0));
      var timeFactor = 0.3 + 0.7 * (m / 90);
      var diff = (Number(hScore) || 0) - (Number(aScore) || 0);
      var redPenalty = ((Number(redA) || 0) - (Number(redH) || 0)) * 0.45;
      var eff = diff * (1 + timeFactor * 1.45) + redPenalty;

      var drawBase = Math.max(8, 30 * (1 - Math.abs(diff) * 0.35) * (1 - m / 115));
      if (diff === 0 && m > 70) drawBase = 30 + (m - 70) * 1.1;

      var rem = 100 - drawBase;
      var homeShare = 1 / (1 + Math.exp(-eff * 1.15));
      var rH = Math.round(rem * homeShare);
      var rD = Math.round(drawBase);
      var rA = 100 - rH - rD;
      if (rA < 0) { rA = 0; rH = 100 - rD; }
      return { home: rH, draw: rD, away: rA };
    }

    function shortTeamLabel(name) {
      if (!name) return '';
      var stop = { fc: 1, cf: 1, cd: 1, sc: 1, ac: 1, rc: 1, rb: 1, sd: 1, ud: 1, de: 1, la: 1, el: 1, del: 1, club: 1, atletico: 1, atlético: 1, deportivo: 1 };
      var tokens = String(name).trim().split(/\s+/).filter(Boolean);
      var significant = tokens.filter(function (t) { return !stop[t.toLowerCase()]; });
      if (significant.length > 0) return significant[significant.length - 1];
      return tokens[0] || name;
    }

    function updatePopupWinProbability(match) {
      if (!match) return;
      var rH = 0, rA = 0;
      knownEvents.forEach(function (ev) {
        if (ev.type === 'RED_CARD') {
          if (ev.team === 'HOME') rH++;
          else if (ev.team === 'AWAY') rA++;
        }
      });
      var probs = calcWinProbability(match.home_score, match.away_score, match.minute, match.status, rH, rA);

      document.getElementById('pop-bar-h').style.width = probs.home + '%';
      document.getElementById('pop-bar-d').style.width = probs.draw + '%';
      document.getElementById('pop-bar-a').style.width = probs.away + '%';

      document.getElementById('pop-prob-h-val').textContent = probs.home + '%';
      document.getElementById('pop-prob-d-val').textContent = probs.draw + '%';
      document.getElementById('pop-prob-a-val').textContent = probs.away + '%';

      if (match.home_team) {
        document.getElementById('pop-prob-h-name').textContent = shortTeamLabel(match.home_team);
      }
      if (match.away_team) {
        document.getElementById('pop-prob-a-name').textContent = shortTeamLabel(match.away_team);
      }
    }

    function updateMatch(match) {
      if (!match) return;
      if (match.home_team && match.home_team !== currentHome) {
        currentHome = match.home_team;
        document.getElementById('pop-home-team').textContent = match.home_team;
        document.getElementById('pop-home-badge').src = '/api/badge?team=' + encodeURIComponent(match.home_team);
      }
      if (match.away_team && match.away_team !== currentAway) {
        currentAway = match.away_team;
        document.getElementById('pop-away-team').textContent = match.away_team;
        document.getElementById('pop-away-badge').src = '/api/badge?team=' + encodeURIComponent(match.away_team);
      }
      animateScore('pop-home-score', match.home_score !== undefined ? match.home_score : 0);
      animateScore('pop-away-score', match.away_score !== undefined ? match.away_score : 0);
      document.getElementById('pop-minute').textContent = match.minute !== undefined ? match.minute : 0;
      updatePopupWinProbability(match);
    }

    function updateActionText(ev) {
      var el = document.getElementById('pop-status-text');
      if (!el || !ev) return;
      var tags = {
        GOAL: 'GOL',
        PENALTY: 'PENAL',
        YELLOW_CARD: 'AMARILLA',
        RED_CARD: 'ROJA',
        SUBSTITUTION: 'CAMBIO',
        MATCH_START: 'INICIO',
        COMMENT: 'EN VIVO'
      };
      var tag = tags[ev.type] || (ev.type || 'SUCESO');
      var player = ev.player ? ' · ' + ev.player : '';
      el.textContent = ev.minute + "' [" + tag + "]" + player + ' — ' + (ev.description || '');
    }

    function focusMainApp() {
      if (window.opener && !window.opener.closed) {
        window.opener.focus();
      } else {
        window.open('/', '_blank');
      }
    }

    function pollSummary() {
      fetch('/api/summary', { cache: 'no-store' })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.events && Array.isArray(data.events)) {
            knownEvents.clear();
            data.events.forEach(function (ev) { knownEvents.set(String(ev.id), ev); });
          }
          if (data.match) updateMatch(data.match);
          if (data.events && data.events.length > 0) updateActionText(data.events[0]);
        })
        .catch(function () {});
    }

    var evtSource = null;
    function connectSSE() {
      if (evtSource) evtSource.close();
      evtSource = new EventSource('/api/stream/vivo?vid=popup_' + Date.now().toString(36));
      evtSource.addEventListener('match_event', function (e) {
        try {
          var payload = JSON.parse(e.data);
          if (payload.reset) knownEvents.clear();
          if (payload.event) {
            knownEvents.set(String(payload.event.id), payload.event);
            updateActionText(payload.event);
          }
          if (payload.match) updateMatch(payload.match);
        } catch (err) {}
      });
      evtSource.addEventListener('connected', function (e) {
        try {
          var payload = JSON.parse(e.data);
          if (payload.match) updateMatch(payload.match);
        } catch (err) {}
      });
      evtSource.onerror = function () {
        setTimeout(connectSSE, 2000);
      };
    }

    pollSummary();
    connectSSE();
    setInterval(pollSummary, 3500);
  </script>
</body>
</html>
