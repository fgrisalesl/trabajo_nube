<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Sombra 3D Volumétrica Neutra (Sin azul) -->
    <filter id="ballDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Clip circular para asegurar esfericidad perfecta -->
    <clipPath id="ballBoundary">
      <circle cx="50" cy="50" r="45"/>
    </clipPath>

    <!-- Gradiente Esférico 3D de Cuero Blanco/Platino Neutro -->
    <radialGradient id="ballLeather" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f4f4f5"/>
      <stop offset="72%" stop-color="#d4d4d8"/>
      <stop offset="88%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#27272a"/>
    </radialGradient>

    <!-- Gradiente de los Parches Negros/Antracita Auténticos -->
    <radialGradient id="patchBlack" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Brillo Especular Curvo (Lustre de Cuero Cristalino) -->
    <linearGradient id="specularGleam" x1="25" y1="10" x2="50" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Luz de Rebote / Rim Light Neutra Plateada -->
    <radialGradient id="rimReflection" cx="65%" cy="75%" r="45%">
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <g filter="url(#ballDropShadow)">
    <!-- Balón de Fútbol 3D con Cuero Real y Recorte Esférico -->
    <g clip-path="url(#ballBoundary)">
      <!-- 1. Esfera Base -->
      <circle cx="50" cy="50" r="45" fill="url(#ballLeather)"/>

      <!-- 2. Costuras y Hendiduras de los Paneles -->
      <path d="M50 35 L50 18
               M64.3 45.4 L79 38
               M58.8 62.1 L73 76
               M41.2 62.1 L27 76
               M35.7 45.4 L21 38"
            stroke="#18181b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M34 13 L50 18 L66 13
               M87 26 L79 38 L93 52
               M86 71 L73 76 L68 91
               M32 91 L27 76 L14 71
               M7 52 L21 38 L13 26"
            stroke="#18181b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 3. Pentágono Central Real -->
      <polygon points="50,35 64.3,45.4 58.8,62.1 41.2,62.1 35.7,45.4"
               fill="url(#patchBlack)"
               stroke="#09090b"
               stroke-width="1.5"/>

      <!-- 4. Parches Negros Periféricos Curvados -->
      <!-- Arriba -->
      <path d="M34 13 C44 7 56 7 66 13 L50 18 Z"
            fill="url(#patchBlack)" stroke="#09090b" stroke-width="1.2"/>
      <!-- Arriba Derecha -->
      <path d="M87 26 C93 34 95 43 93 52 L79 38 Z"
            fill="url(#patchBlack)" stroke="#09090b" stroke-width="1.2"/>
      <!-- Abajo Derecha -->
      <path d="M86 71 C80 81 74 87 68 91 L73 76 Z"
            fill="url(#patchBlack)" stroke="#09090b" stroke-width="1.2"/>
      <!-- Abajo Izquierda -->
      <path d="M32 91 C26 87 20 81 14 71 L27 76 Z"
            fill="url(#patchBlack)" stroke="#09090b" stroke-width="1.2"/>
      <!-- Arriba Izquierda -->
      <path d="M7 52 C5 43 7 34 13 26 L21 38 Z"
            fill="url(#patchBlack)" stroke="#09090b" stroke-width="1.2"/>

      <!-- 5. Reflejo Plateado Neutro en el Borde Inferior -->
      <circle cx="50" cy="50" r="45" fill="url(#rimReflection)"/>

      <!-- 6. Reflejo Especular Superior 3D -->
      <ellipse cx="38" cy="27" rx="16" ry="9" transform="rotate(-28 38 27)" fill="url(#specularGleam)"/>
      <ellipse cx="32" cy="22" rx="6" ry="3" transform="rotate(-28 32 22)" fill="#ffffff" opacity="0.75"/>
    </g>

    <!-- 7. Aro Perimetral Fino y Cristalino -->
    <circle cx="50" cy="50" r="45" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.5" fill="none"/>
  </g>
</svg>