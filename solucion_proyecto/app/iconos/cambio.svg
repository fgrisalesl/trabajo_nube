<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradiente Flecha Entrante (Verde Esmeralda de Entrada) -->
    <linearGradient id="inArrowGrad" x1="15" y1="20" x2="85" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Gradiente Flecha Saliente (Rojo/Coral de Salida) -->
    <linearGradient id="outArrowGrad" x1="85" y1="80" x2="15" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <filter id="subShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#subShadow)">
    <!-- Flecha Superior Entrante (Jugador que entra al campo) -->
    <!-- Cuerpo Curvo de la Flecha -->
    <path d="M26 48 C24 32 36 18 54 18 C66 18 76 25 82 34"
          stroke="url(#inArrowGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Cabeza de la Flecha Entrante -->
    <polygon points="82,20 95,36 74,38"
             fill="#10b981" stroke="#ffffff" stroke-width="1.8"/>

    <!-- Flecha Inferior Saliente (Jugador que sale del campo) -->
    <!-- Cuerpo Curvo de la Flecha -->
    <path d="M74 52 C76 68 64 82 46 82 C34 82 24 75 18 66"
          stroke="url(#outArrowGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Cabeza de la Flecha Saliente -->
    <polygon points="18,80 5,64 26,62"
             fill="#f43f5e" stroke="#ffffff" stroke-width="1.8"/>

    <!-- Brillos Especulares de Relieve 3D -->
    <path d="M30 44 C28 32 38 22 54 22 C64 22 72 27 78 35"
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M70 56 C72 68 62 78 46 78 C36 78 28 73 22 65"
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  </g>
</svg>