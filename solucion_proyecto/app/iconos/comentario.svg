<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradiente de Burbuja de Comentario de Cristal Ahumado Neutro -->
    <linearGradient id="bubbleGrad" x1="15" y1="15" x2="85" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Bisel de Luz Superior Plateado Especular -->
    <linearGradient id="bubbleBrim" x1="20" y1="16" x2="80" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d4d4d8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="commShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#commShadow)">
    <!-- Cuerpo de la Burbuja de Diálogo de Cristal -->
    <path d="M50 16 C28 16 14 28 14 44 C14 53 19 61 28 66 L22 84 L40 74 C43 75 46.5 75.5 50 75.5 C72 75.5 86 63 86 47 C86 31 72 16 50 16 Z"
          fill="url(#bubbleGrad)" stroke="url(#bubbleBrim)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Reflejo Especular Superior -->
    <path d="M48 20 C32 20 22 28 20 38 C32 40 64 38 76 28 C70 23 60 20 48 20 Z"
          fill="#ffffff" opacity="0.35"/>

    <!-- Puntos de Audio / Escritura en Vivo Neutros Radiantes -->
    <circle cx="36" cy="46" r="4.5" fill="#ffffff" filter="drop-shadow(0 0 3px rgba(255,255,255,0.8))"/>
    <circle cx="50" cy="46" r="4.5" fill="#e4e4e7" filter="drop-shadow(0 0 3px rgba(255,255,255,0.6))"/>
    <circle cx="64" cy="46" r="4.5" fill="#a1a1aa" filter="drop-shadow(0 0 3px rgba(255,255,255,0.4))"/>
  </g>
</svg>