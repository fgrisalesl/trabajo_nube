<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradiente Metálico Cromado / Platino Especular -->
    <linearGradient id="micMetal" x1="30" y1="15" x2="70" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e4e4e7"/>
      <stop offset="70%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>

    <!-- Gradiente de la Cúpula / Malla de Estudio Acústica Neutra -->
    <linearGradient id="micDome" x1="36" y1="12" x2="64" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="45%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <filter id="micShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#micShadow)">
    <!-- Ondas de Radio/Voz en Vivo Blancas Radiantes -->
    <path d="M18 36 C14 42 14 50 18 56" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.65" filter="drop-shadow(0 0 3px rgba(255,255,255,0.4))"/>
    <path d="M82 36 C86 42 86 50 82 56" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.65" filter="drop-shadow(0 0 3px rgba(255,255,255,0.4))"/>
    <path d="M12 28 C6 38 6 54 12 64" stroke="#d4d4d8" stroke-width="2.2" stroke-linecap="round" opacity="0.4"/>
    <path d="M88 28 C94 38 94 54 88 64" stroke="#d4d4d8" stroke-width="2.2" stroke-linecap="round" opacity="0.4"/>

    <!-- Cápsula / Rejilla del Micrófono -->
    <rect x="36" y="14" width="28" height="42" rx="14" fill="url(#micDome)" stroke="url(#micMetal)" stroke-width="2"/>

    <!-- Rejilla de Malla del Micrófono Plateada -->
    <line x1="36" y1="28" x2="64" y2="28" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="36" y1="36" x2="64" y2="36" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="38" y1="44" x2="62" y2="44" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="50" y1="14" x2="50" y2="56" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- Banda Metálica de la Cintura -->
    <rect x="35" y="38" width="30" height="4" rx="2" fill="url(#micMetal)" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Horquilla de Soporte Metálica (U-Mount Cromado) -->
    <path d="M26 38 C26 58 36 68 50 68 C64 68 74 58 74 38"
          stroke="url(#micMetal)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Mástil y Base del Micrófono de Cabina -->
    <line x1="50" y1="68" x2="50" y2="82" stroke="url(#micMetal)" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="50" cy="85" rx="22" ry="6" fill="url(#micMetal)" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>