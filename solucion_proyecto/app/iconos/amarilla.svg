<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradiente de Tarjeta Amarilla 3D Brillante -->
    <linearGradient id="yellowCardGrad" x1="20" y1="10" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Bisel de Luz Superior -->
    <linearGradient id="yellowCardBrim" x1="25" y1="12" x2="75" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fef9c3" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Reflejo Especular Diagonal -->
    <linearGradient id="cardGlint" x1="25" y1="12" x2="70" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="yellowCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ca8a04" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#yellowCardShadow)">
    <!-- Tarjeta Amarilla Inclinada con Perspectiva 3D -->
    <rect x="26" y="14" width="48" height="72" rx="7"
          transform="rotate(8 50 50)"
          fill="url(#yellowCardGrad)"
          stroke="url(#yellowCardBrim)"
          stroke-width="2"/>

    <!-- Brillo Especular de Plástico/Cristal Oficial -->
    <path d="M28 17 L70 23 L62 55 L26 42 Z"
          transform="rotate(8 50 50)"
          fill="url(#cardGlint)"/>

    <!-- Detalle de Textura / Borde de Relieve -->
    <rect x="30" y="18" width="40" height="64" rx="4"
          transform="rotate(8 50 50)"
          stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
  </g>
</svg>